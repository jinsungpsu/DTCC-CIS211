<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Course Lectures</title>

    <!-- Use the framework's home.css -->
    <link rel="stylesheet" href="https://jinsungpsu.github.io/DTCC-Lectures-RevealJS-Framework/styles/home.css">

    <!-- Fallback styles in case framework is not available -->
    <style>
        /* Fallback styles if framework CSS doesn't load */
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0a0a;
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            margin: 0;
        }

        .container {
            max-width: 900px;
            width: 100%;
            background: #1a1a1a;
            border-radius: 16px;
            padding: 30px 40px 12px 40px;
            border: 1px solid #2a2a2a;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
        }

        .header-minimal {
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 1px solid #2a2a2a;
        }

        .page-title {
            font-size: 1.4rem;
            font-weight: 600;
            color: #e0e0e0;
            margin: 0;
        }

        .alert-callout {
            background: #1a1a2e;
            border-left: 4px solid #fdcb6e;
            padding: 12px 20px;
            border-radius: 8px;
            margin: 16px 0 24px 0;
            color: #fdcb6e;
        }

        .alert-callout .alert-content p {
            margin: 0;
            font-size: 0.95rem;
        }

        .module-card {
            background: #121212;
            border-radius: 12px;
            padding: 16px 20px;
            margin-bottom: 12px;
            border: 1px solid #2a2a2a;
            transition: border-color 0.2s ease;
        }

        .module-card:hover {
            border-color: #3a3a4a;
        }

        .module-card h2 {
            color: #8be9fd;
            font-size: 1rem;
            margin-top: 0;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .lecture-link {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 14px;
            background: #0d0d0d;
            border-radius: 6px;
            text-decoration: none;
            color: #e0e0e0;
            margin-bottom: 4px;
            border: 1px solid transparent;
            transition: all 0.2s ease;
        }

        .lecture-link:not(.lecture-row):hover {
            background: #1a1a2e;
            border-color: #8bb9ff;
            transform: translateX(4px);
        }

        .lecture-link:last-child {
            margin-bottom: 0;
        }

        .lecture-title {
            font-weight: 400;
            font-size: 0.95rem;
        }

        .lecture-desc {
            font-size: 0.7rem;
            color: #666;
        }

        .footer-minimal {
            margin-top: 20px;
            padding-top: 12px;
            border-top: 1px solid #222;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        .footer-toggle {
            background: none;
            border: none;
            color: #555;
            font-size: 0.75rem;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 4px;
            transition: all 0.2s ease;
            font-family: inherit;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .footer-toggle:hover {
            color: #888;
            background: rgba(255, 255, 255, 0.05);
        }

        .footer-content {
            width: 100%;
            margin-top: 8px;
            padding: 8px 12px;
            background: #0d0d0d;
            border-radius: 6px;
            border: 1px solid #222;
        }

        .footer-inner {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            font-size: 0.75rem;
            color: #666;
        }

        .footer-inner .brand {
            font-weight: 500;
            color: #888;
        }

        .footer-inner .link {
            color: #8bb9ff;
            text-decoration: none;
        }

        .footer-inner .link:hover {
            text-decoration: underline;
        }

        .footer-inner .badge {
            font-size: 0.7rem;
            padding: 2px 8px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid #2a2a2a;
            font-weight: 500;
            color: #fdcb6e;
        }

        .footer-inner .redirect-note {
            color: #555;
            font-size: 0.7rem;
        }

        .footer-inner .redirect-note a {
            color: #8bb9ff;
            text-decoration: none;
        }

        .footer-inner .redirect-note a:hover {
            text-decoration: underline;
        }

        @media (max-width: 600px) {
            .container {
                padding: 20px 20px 10px 20px;
            }

            .page-title {
                font-size: 1.2rem;
            }

            .lecture-link {
                padding: 6px 10px;
            }

            .lecture-title {
                font-size: 0.85rem;
            }

            .footer-inner {
                font-size: 0.7rem;
                gap: 8px;
            }
        }

        .lecture-row { gap: 12px; flex-wrap: wrap; }
        .lecture-row .lecture-title { flex: 1 1 180px; }
        .lecture-actions { display: inline-flex; flex-wrap: wrap; gap: 8px; }
        .lecture-action { display: inline-block; padding: 7px 11px; border: 1px solid #657b9c; border-radius: 5px; color: #dbe8ff; text-decoration: none; font-size: 0.8rem; white-space: nowrap; }
        .lecture-action.primary { background: #244f85; border-color: #5287cb; color: #fff; }
        .lecture-action:hover { background: #344b6d; color: #fff; }
        .lecture-action:focus-visible { outline: 3px solid #a7caff; outline-offset: 3px; }

.module-header-row { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; margin-bottom: 12px; }
.module-header-row h2 { flex: 1 1 220px; margin: 0; color: #8be9fd; font-size: 1rem; }
.module-content-button { display: inline-block; padding: 8px 12px; border: 1px solid #657b9c; border-radius: 5px; color: #dbe8ff; background: #182337; text-decoration: none; font-size: .8rem; margin-left: auto; }
.module-content-button:hover { background: #344b6d; color: #fff; }
.module-content-button:focus-visible { outline: 3px solid #a7caff; outline-offset: 3px; }

.catalog-action-icon { width: 18px; height: 18px; flex: 0 0 auto; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.lecture-action, .module-content-button, .home-lecture-action { display: inline-flex; align-items: center; justify-content: center; gap: 7px; }

.lecture-row { justify-content: flex-start; }
.lecture-title-and-print { display: inline-flex; align-items: center; gap: 8px; flex: 1 1 180px; min-width: 0; }
.lecture-row .lecture-title-and-print .lecture-title { flex: 0 1 auto; min-width: 0; overflow-wrap: anywhere; }
.lecture-print { flex: 0 0 auto; padding: 5px; }
.lecture-print .catalog-action-icon { width: 15px; height: 15px; }

/* A stretched slide link covers the row; print remains a separate link above it. */
.lecture-row, .home-lecture-row { position: relative; }
.catalog-slide-link { color: inherit; text-decoration: none; }
.catalog-slide-link::after { content: ""; position: absolute; inset: 0; z-index: 1; border-radius: 6px; }
.lecture-row .lecture-title-and-print, .home-lecture-row .home-lecture-title-and-print { flex: 0 1 auto; }
.lecture-print { position: relative; z-index: 2; }
.catalog-slide-cue { display: inline-flex; align-items: center; gap: 5px; margin-left: auto; flex: 0 0 auto; color: #a7caff; font-size: .8rem; opacity: 0; transform: translateX(8px); transition: opacity 160ms ease, transform 160ms ease; pointer-events: none; }
.lecture-row:has(.catalog-slide-link:hover), .home-lecture-row:has(.catalog-slide-link:hover),
.lecture-row:has(.catalog-slide-link:focus-visible), .home-lecture-row:has(.catalog-slide-link:focus-visible) { background: #1a1a2e; border-color: #8bb9ff; }
.lecture-row:has(.catalog-slide-link:hover) .catalog-slide-cue, .home-lecture-row:has(.catalog-slide-link:hover) .catalog-slide-cue,
.lecture-row:has(.catalog-slide-link:focus-visible) .catalog-slide-cue, .home-lecture-row:has(.catalog-slide-link:focus-visible) .catalog-slide-cue { opacity: 1; transform: translateX(0); }
.catalog-slide-link:focus-visible { outline: none; }
.catalog-slide-link:focus-visible::after { outline: 3px solid #a7caff; outline-offset: 3px; }
@media (hover: none) { .catalog-slide-cue { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .catalog-slide-cue { transition: none; transform: none; } }
    </style>
</head>

<body>
    <div class="container">
        <!-- Minimal header -->
        <div class="header-minimal">
            <h1 class="page-title">📚 Lecture Catalog</h1>
        </div>

        <!-- Callout/Alert box for course message -->
        <div id="course-message-container" class="alert-callout" style="display: none;">
            <div class="alert-content">
                <p id="course-message"></p>
            </div>
        </div>

        <div id="modules-container">
            <!-- dynamically generated -->
            <div style="text-align:center;padding:40px;color:#666;">
                <span style="font-size:2rem;display:block;margin-bottom:12px;">📚</span>
                Loading lectures...
            </div>
        </div>

        <!-- Minimal collapsible footer -->
        <div class="footer-minimal">
            <button class="footer-toggle" onclick="toggleFooter()" title="Toggle framework info">
                <span id="footer-toggle-icon">▶</span> <span class="footer-toggle-label">About</span>
            </button>
            <div id="footer-content" class="footer-content" style="display:none;">
                <div class="footer-inner">
                    <span class="brand">📚 DTCC Lecture Framework</span>
                    <span class="badge" id="env-badge">LOCAL</span>
                    <span class="redirect-note">
                        ⚡ Powered by <a href="https://jinsungpsu.github.io/DTCC-Lectures-RevealJS-Framework/"
                            target="_blank">centralized framework</a>
                    </span>
                    <a href="https://github.com/jinsungpsu/DTCC-Lectures-RevealJS-Framework" target="_blank"
                        class="link">GitHub</a>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Toggle footer visibility
        function toggleFooter() {
            const content = document.getElementById('footer-content');
            const icon = document.getElementById('footer-toggle-icon');
            if (content.style.display === 'none') {
                content.style.display = 'block';
                icon.textContent = '▼';
            } else {
                content.style.display = 'none';
                icon.textContent = '▶';
            }
        }

        // ============================================================
        // DETECT ENVIRONMENT
        // ============================================================
        const isLocal = window.location.hostname === '127.0.0.1' ||
            window.location.hostname === 'localhost';

        const FRAMEWORK_BASE = isLocal
            ? 'http://127.0.0.1:5500/DTCC-Lectures-RevealJS-Framework/'
            : 'https://jinsungpsu.github.io/DTCC-Lectures-RevealJS-Framework/';

        const COURSE_URL = window.location.href.substring(0, window.location.href.lastIndexOf('/') + 1);

        // Update environment badge
        setTimeout(() => {
            const badge = document.getElementById('env-badge');
            if (badge) {
                badge.textContent = isLocal ? '🔧 LOCAL' : '🌐 PRODUCTION';
                badge.style.color = isLocal ? '#fdcb6e' : '#00b894';
            }
        }, 100);

        // ============================================================
        // LOAD MANIFEST FROM COURSE ROOT
        // ============================================================

        async function loadManifest() {
            try {
                const response = await fetch('manifest.json');
                if (!response.ok) {
                    throw new Error('Could not load manifest.json');
                }
                const manifest = await response.json();
                initializeCourse(manifest.course);
                renderModules(manifest.modules);
            } catch (error) {
                console.error('Error loading manifest:', error);

                // Try to load from the framework (legacy mode)
                try {
                    const frameworkResponse = await fetch(FRAMEWORK_BASE + 'manifest.json');
                    if (frameworkResponse.ok) {
                        const manifest = await frameworkResponse.json();
                        initializeCourse(manifest.course);
                        renderModules(manifest.modules);
                        return;
                    }
                } catch (e) {
                    // Framework manifest also failed
                }

                document.getElementById('modules-container').innerHTML = `
                    <div class="module-card" style="border-color:#e17055;">
                        <h2 style="color:#e17055;">⚠️ Error</h2>
                        <p>Unable to load lecture catalog.</p>
                        <p style="font-size:0.8rem;color:#666;margin-top:8px;">
                            Make sure manifest.json exists in the course root.
                        </p>
                    </div>
                `;
            }
        }

        function initializeCourse(course) {
            document.title = course.homeTitle || `${course.institution}, ${course.code}`;

            // Show message if it exists
            const messageContainer = document.getElementById('course-message-container');
            const messageElement = document.getElementById('course-message');

            if (course.message) {
                messageElement.textContent = course.message;
                messageContainer.style.display = 'block';
            } else {
                messageContainer.style.display = 'none';
            }
        }

        function renderModules(modules) {
            const container = document.getElementById('modules-container');
            container.innerHTML = '';

            modules.forEach((module, index) => {
                const moduleCard = document.createElement('div');
                moduleCard.className = 'module-card';

                const moduleHeader = document.createElement('div');
                moduleHeader.className = 'module-header-row';
                const moduleTitle = document.createElement('h2');
                moduleTitle.textContent = `Module ${index + 1}: ${module.title}`;
                const moduleLink = document.createElement('a');
                moduleLink.className = 'module-content-button';
                moduleLink.href = `${FRAMEWORK_BASE}module.html?course=${encodeURIComponent(COURSE_URL)}&module=${encodeURIComponent(module.folder)}`;
                moduleLink.innerHTML = '<svg class="catalog-action-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 5c-3-2-7-2-10-1v15c3-1 7-1 10 1 3-2 7-2 10-1V4c-3-1-7-1-10 1Z"/><path d="M12 5v15"/></svg>';
                moduleLink.appendChild(document.createTextNode('View all module content'));
                moduleLink.title = 'Read all lectures in this module on one page';
                moduleLink.setAttribute('aria-label', `View all module content: ${module.title}`);
                moduleHeader.append(moduleTitle, moduleLink);
                moduleCard.appendChild(moduleHeader);

                module.lectures.forEach(lecture => {
                    const lectureLink = document.createElement('div');
                    lectureLink.className = 'lecture-link lecture-row';
                    const filePath = `content/${module.folder}/${lecture.file}`;
                    const params = new URLSearchParams({course: COURSE_URL, deck: filePath});
                    const title = document.createElement('a');
                    title.className = 'lecture-title catalog-slide-link';
                    title.href = `${FRAMEWORK_BASE}slide.html?${params}`;
                    title.textContent = lecture.title;
                    title.setAttribute('aria-label', `View slides: ${lecture.title}`);
                    const content = document.createElement('span');
                    content.className = 'lecture-title-and-print';
                    const print = document.createElement('a');
                    print.className = 'lecture-action lecture-print';
                    print.target = '_blank';
                    print.rel = 'noopener';
                    print.href = `${FRAMEWORK_BASE}print.html?${params}`;
                    print.innerHTML = '<svg class="catalog-action-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6 9V3h12v6M6 17H3V9h18v8h-3"/><path d="M6 14h12v7H6zM17 11h1"/></svg>';
                    print.title = `Print slides: ${lecture.title}`;
                    print.setAttribute('aria-label', `Print slides: ${lecture.title}`);
                    content.append(title, print);
                    const cue = document.createElement('span');
                    cue.className = 'catalog-slide-cue';
                    cue.setAttribute('aria-hidden', 'true');
                    cue.innerHTML = '<svg class="catalog-action-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="m11 6-6 6 6 6m8-12-6 6 6 6"/></svg>View slides';
                    lectureLink.append(content, cue);

                    moduleCard.appendChild(lectureLink);
                });

                container.appendChild(moduleCard);
            });
        }
        // ============================================================
        // START
        // ============================================================

        loadManifest();
    </script>
</body>

</html>
