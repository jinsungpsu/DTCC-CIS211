<!doctype html>
<html>

<head>
    <meta charset="utf-8">


    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js/dist/reveal.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js/dist/theme/dracula.css">



    <!-- reveal plug ins styles -->
    <!-- highlight for code highlighting -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js/plugin/highlight/monokai.css">

    <!-- search for searching through slides -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js/plugin/search/search.css">

    <!-- 3rd party plug  ins -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js-menu@2.1.0/menu.css">

    <!-- custom styles -->
    <link rel=" stylesheet" href="node_modules/reveal.js-menu/menu.css">

</head>

<body>

    <div id="toolbar">
        <button id="homeBtn" title="Return to Lectures">↩ All Lectures</button>
        <button id="prevBtn">◀ Prev</button>
        <button id="nextBtn">Next ▶</button>
        <button id="printBtn">🖨 Print</button>
        <button id="fullscreenBtn">⛶ Fullscreen</button>
    </div>
    <button id="searchBtn" title="Search Slides">🔍 Search</button>

    <div id="fixed-footer" aria-live="polite"></div>

    <div class="reveal">
        <div class="slides">
            <section id="markdown-slide"></section>
        </div>
    </div>


    <!-- revealjs -->
    <script src="https://cdn.jsdelivr.net/npm/reveal.js/dist/reveal.js"></script>

    <!-- built in plugins -->
    <script src="https://cdn.jsdelivr.net/npm/reveal.js/plugin/markdown/markdown.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/reveal.js/plugin/notes/notes.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/reveal.js/plugin/search/search.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/reveal.js/plugin/highlight/highlight.js"> </script>

    <!-- 3rd party plugins -->
    <script src="node_modules/reveal.js-menu/menu.js"></script>

    <!-- Custom scripts -->
    <script src="scripts/slide-parser.js"></script>
    <script src="scripts/slide-app.js"></script>

</body>

</html>
