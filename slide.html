<!doctype html>
<html>

<head>
    <meta charset="utf-8">

    <script src="https://cdn.jsdelivr.net/npm/reveal.js/plugin/highlight/highlight.js"> </script>
    <script src="https://cdn.jsdelivr.net/npm/reveal.js/plugin/search/search.js"></script>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js/dist/reveal.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js/dist/theme/black.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js/plugin/highlight/monokai.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js/plugin/search/search.css">

    <link rel="stylesheet" href="styles/slides.css">

</head>

<body>

    <div id="toolbar">
        <button onclick="openSearch()" title="Search Slides">🔍 Search</button>

        <button onclick="window.location.href='index.html'" title="Return to Lectures">↩ All Lectures</button>
        <button onclick="Reveal.prev()">◀ Prev</button>
        <button onclick="Reveal.next()">Next ▶</button>
        <button onclick="window.print()">🖨 Print</button>
        <button onclick="toggleFullscreen()" id="fullscreenBtn">⛶ Fullscreen</button>
    </div>

    <div class="reveal">
        <div class="slides">
            <section id="markdown-slide"></section>
        </div>
    </div>


    <script src="https://cdn.jsdelivr.net/npm/reveal.js/dist/reveal.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/reveal.js/plugin/markdown/markdown.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/reveal.js/plugin/notes/notes.js"></script>

<script>

    const file =
        new URLSearchParams(window.location.search)
            .get("deck");

    if (!file) {
        document.getElementById("markdown-slide").innerHTML =
            "<h2>No deck specified.</h2>";
        throw new Error("Missing deck parameter");
    }

    const basePath =
        file.substring(0, file.lastIndexOf("/") + 1);

    fetch(file)
        .then(response => response.text())
        .then(markdown => {

            /*
             * Rewrite all relative URLs.
             *
             * Matches:
             *   file.pdf
             *   ![alt](image.jpg)
             *
             * Does NOT modify:
             *   https://...
             *   http://...
             *   /absolute/path
             *   #anchor
             *   mailto:
             */

            markdown = markdown.replace(
                /\]\((?!https?:\/\/|\/|#|mailto:)(.*?)\)/g,
                (match, url) => `](${basePath}${url})`
            );

            // Parse custom syntax (columns, footers)
            markdown = parseCustomSyntax(markdown);

            document.getElementById("markdown-slide").innerHTML = `
                <textarea data-template>
${markdown}
                </textarea>
            `;

            document
                .getElementById("markdown-slide")
                .setAttribute("data-markdown", "");

            Reveal.initialize({
                hash: true,
                controls: true,
                progress: true,
                slideNumber: true,
                plugins: [
                    RevealMarkdown,
                    RevealNotes,
                    RevealHighlight,
                    RevealSearch
                ]
            });

        })
        .catch(error => {
            console.error('Error loading markdown:', error);
            document.getElementById("markdown-slide").innerHTML =
                `<h2>Error loading slide</h2><p>${error.message}</p>`;
        });

    // ===== MAIN PARSER =====
    function parseCustomSyntax(markdown) {
        // First parse footers
        markdown = parseFooters(markdown);
        // Then parse columns
        markdown = parseColumns(markdown);
        return markdown;
    }

    // ===== PARSE <!-- footer --> =====
    function parseFooters(markdown) {
        const lines = markdown.split('\n');
        const result = [];
        let i = 0;

        while (i < lines.length) {
            const line = lines[i];

            // Check if this line starts a footer
            if (line.trim() === '<!-- footer -->') {
                i++; // Move past the marker
                let footerContent = [];

                // Collect all content until next slide separator or end of file
                while (i < lines.length) {
                    const nextLine = lines[i];

                    // Stop at slide separator or column marker
                    if (nextLine.trim() === '---' ||
                        nextLine.trim() === '***' ||
                        nextLine.trim() === '___' ||
                        nextLine.trim() === '<!-- column -->') {
                        break;
                    }

                    footerContent.push(nextLine);
                    i++;
                }

                // Create footer HTML with data-markdown for parsing
                if (footerContent.length > 0) {
                    const footerText = footerContent.join('\n').trim();
                    result.push(`<div class="slide-footer" data-markdown>\n\n${footerText}\n\n</div>`);
                }
            } else {
                result.push(line);
                i++;
            }
        }

        return result.join('\n');
    }

    // ===== PARSE <!-- column --> =====
    function parseColumns(markdown) {
        // First, split into slides (by ---)
        const slides = markdown.split(/\n---\n/);
        const processedSlides = slides.map(slide => {
            return processSlide(slide);
        });
        return processedSlides.join('\n---\n');
    }

    function processSlide(slide) {
        const lines = slide.split('\n');
        const result = [];
        let i = 0;

        while (i < lines.length) {
            const line = lines[i];

            // Check if this line starts a column block
            if (line.trim() === '<!-- column -->') {
                // Start collecting columns
                const columns = [];
                let currentCol = { content: [] };
                let inColumn = true;
                i++; // Move past the marker

                while (i < lines.length && inColumn) {
                    const nextLine = lines[i];

                    // Check for next column marker
                    if (nextLine.trim() === '<!-- column -->') {
                        // Save current column and start a new one
                        if (currentCol.content.length > 0) {
                            columns.push(currentCol.content.join('\n'));
                        }
                        currentCol = { content: [] };
                        i++;
                        continue;
                    }

                    // Check for footer marker (should be handled separately)
                    if (nextLine.trim() === '<!-- footer -->') {
                        // Stop column collection, footer will be handled elsewhere
                        inColumn = false;
                        break;
                    }

                    // Regular content line - add everything
                    currentCol.content.push(nextLine);
                    i++;
                }

                // Save the last column
                if (currentCol.content.length > 0) {
                    columns.push(currentCol.content.join('\n'));
                }

                // Create columns if we have 2 or more
                if (columns.length >= 2) {
                    // Add a class based on number of columns for styling
                    const colsClass = `cols-${Math.min(columns.length, 4)}`;
                    let html = `<div class="columns-container ${colsClass}">\n`;
                    columns.forEach(colContent => {
                        // IMPORTANT: Preserve the content exactly as-is
                        html += `<div class="col" data-markdown>\n\n${colContent}\n\n</div>\n`;
                    });
                    html += '</div>';
                    result.push(html);
                    
                    // Continue with any remaining content after the columns
                    if (i < lines.length) {
                        // Add the remaining lines (could be footer or other content)
                        const remaining = lines.slice(i).join('\n');
                        if (remaining.trim()) {
                            result.push(remaining);
                        }
                    }
                } else if (columns.length === 1) {
                    // Just one column, output as-is
                    result.push(columns[0]);
                }
            } else {
                // Regular line
                result.push(line);
                i++;
            }
        }

        return result.join('\n');
    }

    // ===== TOOLBAR FUNCTIONS =====
    function toggleFullscreen() {

        if (!document.fullscreenElement) {
            document.documentElement.requestFullscreen();
        } else {
            document.exitFullscreen();
        }

    }

    document.addEventListener("fullscreenchange", () => {

        const btn =
            document.getElementById("fullscreenBtn");

        if (!btn) return;

        if (document.fullscreenElement) {

            document.body.classList.add("fullscreen-mode");

            btn.innerHTML = "✕";
            btn.title = "Exit Fullscreen";

        } else {

            document.body.classList.remove("fullscreen-mode");

            btn.innerHTML = "⛶ Fullscreen";
            btn.title = "Enter Fullscreen";

        }

    });

    function openSearch() {

        document.dispatchEvent(
            new KeyboardEvent("keydown", {
                key: "F",
                ctrlKey: true,
                shiftKey: true,
                bubbles: true
            })
        );

    }

</script>

</body>

</html>
