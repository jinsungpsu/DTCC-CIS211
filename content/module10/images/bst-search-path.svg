<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -36 640 411" role="img" aria-labelledby="title desc">
<title id="title">BST search: follow 40 to 60 to 50</title>
<desc id="desc">BST search: follow 40 to 60 to 50. Circular nodes; labels identify the illustrated steps.</desc>
<rect y="-36" width="640" height="411" rx="12" fill="white"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c2410c"/></marker></defs>
<g font-family="Arial, sans-serif">
<g id="bst" transform="translate(320 0)">
<text x="0" y="0" font-size="21" fill="#334155" text-anchor="middle">Find key 50</text>
<g data-parent="r" data-child="l">
<line x1="0" y1="55" x2="-120" y2="145" stroke="#94a3b8" stroke-width="2"/>
</g>
<g data-parent="r" data-child="q">
