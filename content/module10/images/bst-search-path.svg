</g>
<g data-parent="q" data-child="qr">
<line x1="120" y1="145" x2="175" y2="235" stroke="#94a3b8" stroke-width="2"/>
</g>
<circle data-node-id="r" data-key="40" cx="0" cy="55" r="23" fill="#dbeafe" stroke="#1d4ed8" stroke-width="3"/>
<text x="0" y="62" font-size="21" fill="#000000" text-anchor="middle">40</text>
