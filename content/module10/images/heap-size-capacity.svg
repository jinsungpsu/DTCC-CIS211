<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -3 900 218" role="img" aria-labelledby="title desc">
<title id="title">Heap logical size is distinct from array capacity</title>
<desc id="desc">Heap logical size is distinct from array capacity. Circular nodes; labels identify the illustrated steps.</desc>
<rect y="-3" width="900" height="218" rx="12" fill="white"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c2410c"/></marker></defs>
<g font-family="Arial, sans-serif">
<text x="450" y="35" font-size="23" fill="#334155" text-anchor="middle">Size 7; capacity 10</text>
<rect x="100" y="90" width="70" height="45" fill="#f8fafc" stroke="#94a3b8"/>
<text x="135.0" y="119" font-size="20" fill="#334155" text-anchor="middle">10</text>
<text x="135.0" y="81" font-size="15" fill="#64748b" text-anchor="middle">0</text>
<rect x="170" y="90" width="70" height="45" fill="#f8fafc" stroke="#94a3b8"/>
<text x="205.0" y="119" font-size="20" fill="#334155" text-anchor="middle">20</text>
<text x="205.0" y="81" font-size="15" fill="#64748b" text-anchor="middle">1</text>
<rect x="240" y="90" width="70" height="45" fill="#f8fafc" stroke="#94a3b8"/>
<text x="275.0" y="119" font-size="20" fill="#334155" text-anchor="middle">15</text>
<text x="275.0" y="81" font-size="15" fill="#64748b" text-anchor="middle">2</text>
<rect x="310" y="90" width="70" height="45" fill="#f8fafc" stroke="#94a3b8"/>
<text x="345.0" y="119" font-size="20" fill="#334155" text-anchor="middle">40</text>
<text x="345.0" y="81" font-size="15" fill="#64748b" text-anchor="middle">3</text>
<rect x="380" y="90" width="70" height="45" fill="#f8fafc" stroke="#94a3b8"/>
<text x="415.0" y="119" font-size="20" fill="#334155" text-anchor="middle">50</text>
<text x="415.0" y="81" font-size="15" fill="#64748b" text-anchor="middle">4</text>
<rect x="450" y="90" width="70" height="45" fill="#f8fafc" stroke="#94a3b8"/>
<text x="485.0" y="119" font-size="20" fill="#334155" text-anchor="middle">30</text>
<text x="485.0" y="81" font-size="15" fill="#64748b" text-anchor="middle">5</text>
<rect x="520" y="90" width="70" height="45" fill="#f8fafc" stroke="#94a3b8"/>
<text x="555.0" y="119" font-size="20" fill="#334155" text-anchor="middle">25</text>
<text x="555.0" y="81" font-size="15" fill="#64748b" text-anchor="middle">6</text>
<rect x="590" y="90" width="70" height="45" fill="#fff" stroke="#94a3b8" stroke-dasharray="4 3"/>
<text x="625.0" y="119" font-size="16" fill="#334155" text-anchor="middle">unused</text>
<text x="625.0" y="81" font-size="15" fill="#64748b" text-anchor="middle">7</text>
<rect x="660" y="90" width="70" height="45" fill="#fff" stroke="#94a3b8" stroke-dasharray="4 3"/>
<text x="695.0" y="119" font-size="16" fill="#334155" text-anchor="middle">unused</text>
<text x="695.0" y="81" font-size="15" fill="#64748b" text-anchor="middle">8</text>
<rect x="730" y="90" width="70" height="45" fill="#fff" stroke="#94a3b8" stroke-dasharray="4 3"/>
<text x="765.0" y="119" font-size="16" fill="#334155" text-anchor="middle">unused</text>
<text x="765.0" y="81" font-size="15" fill="#64748b" text-anchor="middle">9</text>
<text x="450" y="190" font-size="19" fill="#334155" text-anchor="middle">Only indices 0 through 6 are nodes; spare capacity is not part of the tree.</text>
</g></svg>
