<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -36 760 481" role="img" aria-labelledby="title desc">
<title id="title">An AVL tree can have holes in a positional array</title>
<desc id="desc">An AVL tree can have holes in a positional array. Circular nodes; labels identify the illustrated steps.</desc>
<rect y="-36" width="760" height="481" rx="12" fill="white"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c2410c"/></marker></defs>
<g font-family="Arial, sans-serif">
<g id="avl" transform="translate(380 0)">
<text x="0" y="0" font-size="21" fill="#334155" text-anchor="middle">Balanced, but not complete</text>
<g data-parent="r" data-child="l">
<line x1="0" y1="55" x2="-120" y2="145" stroke="#94a3b8" stroke-width="2"/>
</g>
<g data-parent="r" data-child="q">
<line x1="0" y1="55" x2="120" y2="145" stroke="#94a3b8" stroke-width="2"/>
</g>
<g data-parent="q" data-child="ql">
<line x1="120" y1="145" x2="65" y2="235" stroke="#94a3b8" stroke-width="2"/>
</g>
<circle data-node-id="r" data-key="30" cx="0" cy="55" r="23" fill="#f1f5f9" stroke="#64748b" stroke-width="3"/>
<text x="0" y="62" font-size="21" fill="#000000" text-anchor="middle">30</text>
<circle data-node-id="l" data-key="10" cx="-120" cy="145" r="23" fill="#f1f5f9" stroke="#64748b" stroke-width="3"/>
<text x="-120" y="152" font-size="21" fill="#000000" text-anchor="middle">10</text>
<circle data-node-id="q" data-key="50" cx="120" cy="145" r="23" fill="#f1f5f9" stroke="#64748b" stroke-width="3"/>
<text x="120" y="152" font-size="21" fill="#000000" text-anchor="middle">50</text>
<circle data-node-id="ql" data-key="40" cx="65" cy="235" r="23" fill="#f1f5f9" stroke="#64748b" stroke-width="3"/>
<text x="65" y="242" font-size="21" fill="#000000" text-anchor="middle">40</text>
</g>
<rect x="170" y="325" width="70" height="45" fill="#f8fafc" stroke="#94a3b8"/>
<text x="205.0" y="354" font-size="20" fill="#334155" text-anchor="middle">30</text>
<text x="205.0" y="316" font-size="15" fill="#64748b" text-anchor="middle">0</text>
<rect x="240" y="325" width="70" height="45" fill="#f8fafc" stroke="#94a3b8"/>
<text x="275.0" y="354" font-size="20" fill="#334155" text-anchor="middle">10</text>
<text x="275.0" y="316" font-size="15" fill="#64748b" text-anchor="middle">1</text>
<rect x="310" y="325" width="70" height="45" fill="#f8fafc" stroke="#94a3b8"/>
<text x="345.0" y="354" font-size="20" fill="#334155" text-anchor="middle">50</text>
<text x="345.0" y="316" font-size="15" fill="#64748b" text-anchor="middle">2</text>
<rect x="380" y="325" width="70" height="45" fill="#fff" stroke="#94a3b8"/>
<text x="415.0" y="354" font-size="16" fill="#334155" text-anchor="middle">empty</text>
<text x="415.0" y="316" font-size="15" fill="#64748b" text-anchor="middle">3</text>
<rect x="450" y="325" width="70" height="45" fill="#fff" stroke="#94a3b8"/>
<text x="485.0" y="354" font-size="16" fill="#334155" text-anchor="middle">empty</text>
<text x="485.0" y="316" font-size="15" fill="#64748b" text-anchor="middle">4</text>
<rect x="520" y="325" width="70" height="45" fill="#f8fafc" stroke="#94a3b8"/>
<text x="555.0" y="354" font-size="20" fill="#334155" text-anchor="middle">40</text>
<text x="555.0" y="316" font-size="15" fill="#64748b" text-anchor="middle">5</text>
<text x="380" y="420" font-size="19" fill="#334155" text-anchor="middle">AVL balance is valid even with empty positions 3 and 4.</text>
</g></svg>
