<svg xmlns="http://www.w3.org/2000/svg" width="480" height="202" viewBox="0 0 520 220" role="img" aria-labelledby="title desc">
  <title id="title">Weighted directed graph for Dijkstra's algorithm</title>
  <desc id="desc">A points to B with weight 2 and C with weight 9. B points to C with weight 3.</desc>
  <rect width="520" height="220" rx="12" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>
  <g stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)">
    <line x1="127" y1="143" x2="240" y2="68"/>
    <line x1="280" y1="68" x2="391" y2="142"/>
    <line x1="131" y1="156" x2="388" y2="156"/>
  </g>
  <g font-family="Arial, sans-serif" font-size="21" font-weight="700" text-anchor="middle">
    <text x="177" y="92" fill="#334155">2</text>
    <text x="343" y="92" fill="#334155">3</text>
    <text x="260" y="146" fill="#334155">9</text>
    <circle cx="108" cy="156" r="23" fill="#dbeafe" stroke="#1d4ed8" stroke-width="3"/>
    <text x="108" y="163" fill="#000000">A</text>
    <circle cx="260" cy="55" r="23" fill="#f1f5f9" stroke="#64748b" stroke-width="3"/>
    <text x="260" y="62" fill="#000000">B</text>
    <circle cx="412" cy="156" r="23" fill="#f1f5f9" stroke="#64748b" stroke-width="3"/>
    <text x="412" y="163" fill="#000000">C</text>
  </g>
</svg>
