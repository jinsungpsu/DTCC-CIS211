<svg xmlns="http://www.w3.org/2000/svg" width="480" height="203" viewBox="0 0 520 220" role="img" aria-labelledby="title desc">
  <title id="title">Complete binary tree for the heap exercise</title>
  <desc id="desc">Root 40 has children 30 and 35. Node 30 has children 12 and 25. Node 35 has left child 20.</desc>
  <rect width="520" height="220" rx="12" fill="#ffffff"/>
  <g stroke="#94a3b8" stroke-width="2">
    <line x1="260" y1="34" x2="165" y2="110"/>
    <line x1="260" y1="34" x2="355" y2="110"/>
    <line x1="165" y1="110" x2="105" y2="185"/>
    <line x1="165" y1="110" x2="225" y2="185"/>
    <line x1="355" y1="110" x2="295" y2="185"/>
  </g>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <circle cx="260" cy="34" r="23" fill="#f1f5f9" stroke="#64748b" stroke-width="3"/>
    <text x="260" y="41" fill="#000000" font-size="21" font-weight="700">40</text>
    <circle cx="165" cy="110" r="23" fill="#f1f5f9" stroke="#64748b" stroke-width="3"/>
    <text x="165" y="117" fill="#000000" font-size="21" font-weight="700">30</text>
    <circle cx="355" cy="110" r="23" fill="#f1f5f9" stroke="#64748b" stroke-width="3"/>
    <text x="355" y="117" fill="#000000" font-size="21" font-weight="700">35</text>
    <circle cx="105" cy="185" r="23" fill="#f1f5f9" stroke="#64748b" stroke-width="3"/>
    <text x="105" y="192" fill="#000000" font-size="21" font-weight="700">12</text>
    <circle cx="225" cy="185" r="23" fill="#f1f5f9" stroke="#64748b" stroke-width="3"/>
    <text x="225" y="192" fill="#000000" font-size="21" font-weight="700">25</text>
    <circle cx="295" cy="185" r="23" fill="#f1f5f9" stroke="#64748b" stroke-width="3"/>
    <text x="295" y="192" fill="#000000" font-size="21" font-weight="700">20</text>
  </g>
</svg>
