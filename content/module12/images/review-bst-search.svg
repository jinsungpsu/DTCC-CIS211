<svg xmlns="http://www.w3.org/2000/svg" width="480" height="203" viewBox="0 0 520 220" role="img" aria-labelledby="title desc">
  <title id="title">Binary search tree for the search exercise</title>
  <desc id="desc">Root 18 has left child 9 and right child 26. Node 9 has right child 13.</desc>
  <rect width="520" height="220" rx="12" fill="#ffffff"/>
  <g stroke="#94a3b8" stroke-width="2">
    <line x1="260" y1="34" x2="160" y2="110"/>
    <line x1="260" y1="34" x2="360" y2="110"/>
    <line x1="160" y1="110" x2="222" y2="185"/>
  </g>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <circle cx="260" cy="34" r="23" fill="#f1f5f9" stroke="#64748b" stroke-width="3"/>
    <text x="260" y="41" fill="#000000" font-size="21" font-weight="700">18</text>
    <circle cx="160" cy="110" r="23" fill="#f1f5f9" stroke="#64748b" stroke-width="3"/>
    <text x="160" y="117" fill="#000000" font-size="21" font-weight="700">9</text>
    <circle cx="360" cy="110" r="23" fill="#f1f5f9" stroke="#64748b" stroke-width="3"/>
    <text x="360" y="117" fill="#000000" font-size="21" font-weight="700">26</text>
    <circle cx="222" cy="185" r="23" fill="#f1f5f9" stroke="#64748b" stroke-width="3"/>
    <text x="222" y="192" fill="#000000" font-size="21" font-weight="700">13</text>
  </g>
</svg>
