<svg xmlns="http://www.w3.org/2000/svg" width="480" height="133" viewBox="0 0 520 145" role="img" aria-labelledby="title desc">
  <title id="title">Three-node tree for the traversal exercise</title>
  <desc id="desc">Root 18 has left leaf 9 and right leaf 26.</desc>
  <rect width="520" height="145" rx="12" fill="#ffffff"/>
  <g stroke="#94a3b8" stroke-width="2">
    <line x1="260" y1="35" x2="165" y2="106"/>
    <line x1="260" y1="35" x2="355" y2="106"/>
  </g>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <circle cx="260" cy="35" r="23" fill="#f1f5f9" stroke="#64748b" stroke-width="3"/>
    <text x="260" y="42" fill="#000000" font-size="21" font-weight="700">18</text>
    <circle cx="165" cy="106" r="23" fill="#f1f5f9" stroke="#64748b" stroke-width="3"/>
    <text x="165" y="113" fill="#000000" font-size="21" font-weight="700">9</text>
    <circle cx="355" cy="106" r="23" fill="#f1f5f9" stroke="#64748b" stroke-width="3"/>
    <text x="355" y="113" fill="#000000" font-size="21" font-weight="700">26</text>
  </g>
</svg>
