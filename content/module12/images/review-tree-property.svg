<svg xmlns="http://www.w3.org/2000/svg" width="480" height="156" viewBox="0 0 520 170" role="img" aria-labelledby="title desc">
  <title id="title">Top two levels of a binary tree</title>
  <desc id="desc">Root 18 has left child 11 and right child 27. Lower levels are not shown.</desc>
  <rect width="520" height="170" rx="12" fill="#ffffff"/>
  <g stroke="#94a3b8" stroke-width="2">
    <line x1="260" y1="35" x2="165" y2="105"/>
    <line x1="260" y1="35" x2="355" y2="105"/>
  </g>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <circle cx="260" cy="35" r="23" fill="#dbeafe" stroke="#1d4ed8" stroke-width="3"/>
    <text x="260" y="42" fill="#000000" font-size="21" font-weight="700">18</text>
    <circle cx="165" cy="105" r="23" fill="#f1f5f9" stroke="#64748b" stroke-width="3"/>
    <text x="165" y="112" fill="#000000" font-size="21" font-weight="700">11</text>
    <circle cx="355" cy="105" r="23" fill="#f1f5f9" stroke="#64748b" stroke-width="3"/>
    <text x="355" y="112" fill="#000000" font-size="21" font-weight="700">27</text>
    <text x="260" y="157" fill="#334155" font-size="16">Only the top two levels are shown.</text>
  </g>
</svg>
