<!doctype html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Reveal.js core CSS - CDN -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@4.3.1/dist/reveal.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@4.3.1/dist/theme/black.css">

    <!-- Reveal plugins styles - CDN -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@4.3.1/plugin/highlight/monokai.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@latest/plugin/search/search.css">

    <!-- 3rd party plugins - CDN -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js-menu@2.0.0/menu.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js-plugins@latest/chalkboard/style.css">

    <!-- Custom styles -->
    <link rel="stylesheet" href="styles/slides.css">

</head>

<body>
    <div id="toolbar">

        <!-- Group 2: Lecture Navigation -->
        <span class="toolbar-group">
            <span class="toolbar-group-label">Lectures</span>
            <button id="homeBtn" title="Return to Lectures">☰ All</button>
            <button id="prevLectureBtn" title="Previous Lecture">◀ Prev</button>
            <button id="nextLectureLectureBtn" title="Next Lecture">Next ▶</button>
        </span>

        <!-- Group 1: Course/Lecture Info (Breadcrumb) -->
        <span class="toolbar-group" id="breadcrumb-group">
            <span id="lecture-info">
                <span id="course-short"></span>
                <span class="separator">›</span>
                <span id="module-name"></span>
                <span class="separator">›</span>
                <span id="lecture-title"></span>
            </span>
        </span>

        <!-- Group 3: Slide Navigation -->
        <span class="toolbar-group">
            <span class="toolbar-group-label">Slides</span>
            <button id="menuBtn" title="Table of Contents">☰ All</button>
            <button id="prevBtn" title="Previous Slide">◀ Prev</button>
            <button id="nextBtn" title="Next Slide">Next ▶</button>
        </span>

        <!-- Group 4: Tools -->
        <span class="toolbar-group">
            <span class="toolbar-group-label">Tools</span>
            <button id="searchBtn" title="Search Slides">🔍</button>
            <button id="notesBtn" title="Toggle Notes Canvas">✏️</button>
            <button id="printBtn">🖨</button>
            <button id="fullscreenBtn">⛶</button>
        </span>
    </div>

    <div id="fixed-footer" aria-live="polite"></div>

    <div class="reveal">
        <div class="slides">
            <section id="markdown-slide"></section>
        </div>
    </div>

    <!-- Reveal.js core - CDN -->
    <script src="https://cdn.jsdelivr.net/npm/reveal.js@4.3.1/dist/reveal.js"></script>

    <!-- Built-in plugins - CDN -->
    <script src="https://cdn.jsdelivr.net/npm/reveal.js@4.3.1/plugin/markdown/markdown.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/reveal.js@4.3.1/plugin/notes/notes.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/reveal.js@latest/plugin/search/search.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/reveal.js@4.3.1/plugin/highlight/highlight.js"></script>

    <!-- 3rd party plugins - CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/reveal.js-menu@2.0.0/menu.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/reveal.js-plugins@latest/chalkboard/plugin.js"></script>



    <!-- Custom scripts -->
    <script src="scripts/slide-parser.js"></script>
    <script src="scripts/lecture-nav.js"></script>
    <script src="scripts/slide-app.js"></script>

</body>

</html>
